<script>
    document.addEventListener('DOMContentLoaded', function() {
      // Solo ejecutamos esta lógica si es un dispositivo móvil/pantalla chica
      if (window.innerWidth <= 768) {
        
        window.addEventListener('touchend', function(e) {
          // CONTROL DE USABILIDAD: Comprobamos qué elemento tocó el usuario
          // Si tocó un enlace (<a>), un botón (<button>), o la barra misma, NO hacemos nada.
          if (
            e.target.closest('a') || 
            e.target.closest('button') || 
            e.target.closest('[class*="bottom"]')
          ) {
            return; // Permite que el link o el botón funcionen normalmente
          }

          // Si tocó cualquier otro lado libre de la pantalla, alternamos la barra
          document.body.classList.toggle('mostrar-menu');
        }, { passive: true });

      }
    });
  </script>

/* =========================================================
   Global readability patch
   Textos secundarios más oscuros y legibles
   ========================================================= */

/* Grises muy claros → gris medio oscuro */
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-slate-400"],
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-gray-400"],
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-zinc-400"],
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-neutral-400"] {
  color: #334155 !important; /* slate-700 */
}

/* text-slate-500 → bastante más oscuro */
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-slate-500"],
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-gray-500"],
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-zinc-500"],
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-neutral-500"] {
  color: #1e293b !important; /* slate-800 */
}

/* text-slate-600 → casi negro */
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-slate-600"],
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-gray-600"],
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-zinc-600"],
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="text-neutral-600"] {
  color: #0f172a !important; /* slate-900 */
}

/* Opacidades bajas → mucho más visibles */
.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="opacity-40"] {
  opacity: 0.85 !important;
}

.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="opacity-50"] {
  opacity: 0.9 !important;
}

.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="opacity-60"] {

}

.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="opacity-70"] {
  opacity: 0.96 !important;
}

.slidev-layout :is(p, span, li, small, figcaption, blockquote)[class~="opacity-80"] {
  opacity: 1 !important;
}



/* 1. CONFIGURACIÓN CSS: Ocultar barra en móviles y prepararla para la animación */
@media (max-width: 768px) {
    /* Buscamos el contenedor de la barra inferior usando tu selector efectivo */
    [class*="bottom"] {
    transform: translateY(120%) !important; /* La esconde hacia abajo */
    transition: transform 0.3s ease-in-out !important; /* Animación suave */
    display: flex !important; /* Asegura que no se rompa el diseño interno */
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: auto !important;
    }

    /* Clase dinámica que aplicaremos con JS para mostrar la barra */
    body.mostrar-menu [class*="bottom"] {
    transform: translateY(0%) !important; /* La sube a su posición original */
    }
}
